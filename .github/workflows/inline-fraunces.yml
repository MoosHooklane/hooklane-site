name: inline-fraunces
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  inline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Fraunces woff2 and inline as data URIs
        run: |
          if grep -q 'data:font/woff2' site.css; then echo already; exit 0; fi
          curl -fsSL -o /tmp/f600.woff2 https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.2.5/files/fraunces-latin-600-normal.woff2
          curl -fsSL -o /tmp/f700.woff2 https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.2.5/files/fraunces-latin-700-normal.woff2
          python3 -c 'import base64,pathlib; b600=base64.b64encode(pathlib.Path("/tmp/f600.woff2").read_bytes()).decode(); b700=base64.b64encode(pathlib.Path("/tmp/f700.woff2").read_bytes()).decode(); css=pathlib.Path("site.css").read_text(); faces="@font-face {\n  font-family: Fraunces;\n  src: url(\"data:font/woff2;base64,"+b600+"\") format(\"woff2\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: Fraunces;\n  src: url(\"data:font/woff2;base64,"+b700+"\") format(\"woff2\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n"; css=css.replace("@font-face {\n  font-family: Fraunces;\n  src: url(\"fonts/fraunces-600.woff2\") format(\"woff2\");\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: Fraunces;\n  src: url(\"fonts/fraunces-700.woff2\") format(\"woff2\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n", faces, 1) if "fonts/fraunces-600.woff2" in css else (css[:css.find("*, *::before")] + faces + css[css.find("*, *::before")] if "*, *::before" in css else faces+css); pathlib.Path("site.css").write_text(css); assert "data:font/woff2" in css; print("ok", len(css), len(b600), len(b700))'
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site.css
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "craft pass: full-bleed Hooklane, proof as object, keep identity."
          git push
