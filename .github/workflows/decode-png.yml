name: decode-png-payloads
on:
  push:
    paths:
      - "assets-b64/**"
      - ".github/workflows/decode-png.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNG payloads to real binaries
        run: |
          python3 <<'PY'
          import base64, pathlib, sys
          src = pathlib.Path("assets-b64")
          if not src.exists():
              raise SystemExit("no assets-b64")
          ok = 0
          for p in sorted(src.glob("*.b64")):
              name = p.name[:-4]
              raw = "".join(p.read_text().split())
              pad = "=" * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw + pad)
              print(name, "chars", len(raw), "bytes", len(data), "sig", data[:8].hex())
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  print("skip not png", name)
                  continue
              pathlib.Path(name).write_bytes(data)
              print("wrote", name, len(data))
              ok += 1
          if ok == 0:
              raise SystemExit("no pngs decoded")
          PY
      - name: Commit real PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in favicon-32.png favicon-48.png apple-touch-icon.png mark.png hooklane-mark-mail.png; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git status
          if git diff --cached --quiet; then
            echo "no png changes"
            exit 0
          fi
          git commit -m "sharp hook+lane mark in header and real favicon files."
          git pull --rebase origin main
          git push
