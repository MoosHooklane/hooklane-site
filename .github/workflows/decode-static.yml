name: decode-static
on:
  push:
    branches: [main]
    paths:
      - "og.jpg.b64"
      - ".github/og.b64.part1"
      - ".github/og.b64.part2"
      - ".github/og.b64.part3"
      - ".github/og.b64.part4"
      - ".github/workflows/decode-static.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Materialize static og.jpg
        run: |
          python3 << 'PY'
          import base64, pathlib, sys
          root = pathlib.Path(".")
          p = root / "og.jpg.b64"
          parts = [root / f".github/og.b64.part{i}" for i in range(1, 5)]
          if p.exists():
              b64 = "".join(p.read_text().split())
          elif all(x.exists() for x in parts):
              b64 = "".join(x.read_text().strip() for x in parts)
          else:
              print("no jpeg source yet")
              sys.exit(0)
          data = base64.b64decode(b64)
          if len(data) != 31521 or data[:3] != bytes([255, 216, 255]) or data[-2:] != bytes([255, 217]):
              sys.exit(f"bad jpeg {len(data)} {data[:3].hex()}")
          (root / "og.jpg").write_bytes(data)
          print("wrote og.jpg", len(data), data[:3].hex())
          PY
          test -f og.jpg || { echo skip; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f og.jpg.b64 decode.js
          rm -f .github/og.b64.part1 .github/og.b64.part2 .github/og.b64.part3 .github/og.b64.part4
          rm -f .github/workflows/decode-static.yml
          git add -A
          git commit -m "restore brand one-pager on main, static og.jpg, drop og function"
          git push
