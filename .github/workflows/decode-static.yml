name: decode-static
on:
  push:
    branches: [main]
    paths:
      - "og.jpg.b64"
      - "fonts/**.b64"
      - "site.css.b64"
      - "site.css.b64.part1"
      - "site.css.b64.part2"
      - ".github/workflows/decode-static.yml"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode binaries and inlined CSS
        run: |
          python3 << 'PY'
          import base64, pathlib, sys
          root = pathlib.Path(".")
          def load_b64(path):
              return "".join(path.read_text().split())
          def write_decoded(src, dest, expect_len=None, soi=None):
              p = root / src
              if not p.exists():
                  print("skip missing", src)
                  return False
              data = base64.b64decode(load_b64(p))
              destp = root / dest
              destp.parent.mkdir(parents=True, exist_ok=True)
              destp.write_bytes(data)
              print(dest, len(data), data[:4].hex())
              if expect_len is not None and len(data) != expect_len:
                  sys.exit(f"{dest} size {len(data)} != {expect_len}")
              if soi and data[:3] != soi:
                  sys.exit(f"{dest} bad soi {data[:3].hex()}")
              return True
          write_decoded("og.jpg.b64", "og.jpg", 31521, bytes([255, 216, 255]))
          write_decoded("fonts/fraunces-600.woff2.b64", "fonts/fraunces-600.woff2", 18096)
          write_decoded("fonts/fraunces-700.woff2.b64", "fonts/fraunces-700.woff2", 18212)
          css_path = root / "site.css.b64"
          p1 = root / "site.css.b64.part1"
          p2 = root / "site.css.b64.part2"
          data = None
          if css_path.exists():
              data = base64.b64decode(load_b64(css_path))
          elif p1.exists() and p2.exists():
              data = base64.b64decode(load_b64(p1) + load_b64(p2))
          if data is not None:
              if b"data:font/woff2" not in data:
                  sys.exit("site.css missing data:font/woff2")
              if b"buy.polar.sh" in data or b"faceless-content guru" in data:
                  sys.exit("site.css must not contain Polar URL or H1")
              (root / "site.css").write_bytes(data)
              print("site.css", len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f og.jpg.b64 fonts/*.b64 site.css.b64 site.css.b64.part1 site.css.b64.part2 decode.js
          rm -f .github/workflows/decode-static.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "add static og.jpg and Fraunces woff2; inline Fraunces in CSS so the serif loads without woff2 URLs"
          git push
