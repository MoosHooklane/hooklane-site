name: restore-mark
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put hook+lane PNG data URI on the header img
        run: |
          python3 -c 'import re,subprocess,pathlib; old=subprocess.check_output(["git","show","97f5a3b0f739c53f194fe68be7f180c81a9de0fb:index.html"],text=True); m=re.search(r"data:image/png;base64,[A-Za-z0-9+/=]+", old); html=pathlib.Path("index.html").read_text(); mark=m.group(0); html=html.replace("src=\"mark.svg\"", "src=\""+mark+"\"", 1); pathlib.Path("index.html").write_text(html); print("mark", len(mark), "has_data", "data:image/png" in html)'
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "craft pass: full-bleed Hooklane, proof as object, keep identity."
          git push
